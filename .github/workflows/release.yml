name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build UI bundle
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Stage + package the app
        id: package
        run: |
          VER=$(grep -E '^version' default/app.conf | head -1 | awk '{print $3}')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          REL=dist/stage
          mkdir -p "$REL/viz-alert-snapshot"
          # anchored excludes (/ui/ = top-level only, NOT default/data/ui)
          rsync -a \
            --exclude='/.git/' --exclude='/.github/' --exclude='/.gitignore' \
            --exclude='/ui/' --exclude='/docs/' --exclude='/dist/' \
            --exclude='__pycache__/' --exclude='*.pyc' --exclude='.DS_Store' \
            ./ "$REL/viz-alert-snapshot/"
          find "$REL/viz-alert-snapshot" -type d -exec chmod 755 {} \;
          find "$REL/viz-alert-snapshot" -type f -exec chmod 644 {} \;
          tar -czf "dist/viz-alert-snapshot-$VER.tar.gz" -C "$REL" viz-alert-snapshot
          ls -la dist/

      - name: AppInspect (non-blocking)
        continue-on-error: true
        run: |
          pip install --quiet splunk-appinspect || true
          splunk-appinspect inspect "dist/viz-alert-snapshot-${{ steps.package.outputs.version }}.tar.gz" \
            --output-file dist/appinspect.json --data-format json || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/viz-alert-snapshot-*.tar.gz
            dist/appinspect.json
          generate_release_notes: true
